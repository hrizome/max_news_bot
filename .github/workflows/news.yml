name: Auto News Bot

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5 # <-- Если скрипт зависнет, он умрет через 5 минут

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # <-- Обновили версию

      - name: Set up Python
        uses: actions/setup-python@v5 # <-- Обновили версию
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser beautifulsoup4 google-genai

      - name: Run bot
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: 1  # <-- ВАЖНО: выводим логи сразу
        run: python publisher.py

      - name: Commit and push sent_news.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_news.txt || true
          git commit -m "Update sent news history" || true
          git push || true
